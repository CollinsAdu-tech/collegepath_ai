services:
  - type: web
    name: collegepath-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        sync: false # set in dashboard: your Cloudflare Pages URL, no trailing slash
      - key: SIMILARITY_THRESHOLD
        value: "0.40"
      - key: TOP_K
        value: "3"
